# Render Blueprint for the PM Copilot backend (free tier).
#
# Deploy: in the Render dashboard choose "New +" → "Blueprint", point it at this repo, and
# set the root directory to `backend`. Render reads this file, provisions the service, and
# prompts for the secret env vars marked `sync: false` below.
#
# Notes:
#   * $PORT is provided by Render — uvicorn must bind to it (see startCommand).
#   * Migrations run at startup (`alembic upgrade head && uvicorn ...`). It's idempotent and
#     works on the FREE plan (Render's dedicated preDeployCommand needs a paid instance).
#   * The database itself is Neon (external), so we do NOT declare a Render database here;
#     we just pass its connection string as DATABASE_URL.
services:
  - type: web
    name: pm-copilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_PROVIDER
        value: gemini        # "gemini" or "groq" — the other is used as a fallback if it has a key
      - key: GROQ_API_KEY
        sync: false          # secret — free key from https://console.groq.com
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBED_PROVIDER
        value: local         # fastembed, runs in-process (no key)
      - key: DATABASE_URL
        sync: false          # your Neon connection string (postgresql+psycopg://...)
      - key: JWT_SECRET
        sync: false          # generate with: openssl rand -hex 32
      - key: JWT_EXPIRE_MINUTES
        value: "10080"       # 7 days; sessions slide via /auth/refresh
      - key: FRONTEND_URL
        sync: false          # your Vercel URL(s), comma-separated, no trailing slash
      - key: FRONTEND_ORIGIN_REGEX
        sync: false          # optional: regex for your Vercel preview deploys
      - key: SENTRY_DSN
        sync: false          # optional: Sentry DSN for backend error tracking
      - key: GOOGLE_CLIENT_ID
        sync: false          # your Google OAuth Web Client ID (enables /auth/google)
      # Gemini (primary). GEMINI_FALLBACK_MODELS defaults to 3.7-flash, 3.5-flash, 3.5-flash-lite.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
