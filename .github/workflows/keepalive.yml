# Keeps the free Render backend from sleeping (it spins down after ~15 idle minutes, making
# the next visitor wait 30-60s). Pings /health every 10 minutes.
#
# Uses the repository variable BACKEND_URL if set (Settings → Secrets and variables →
# Actions → Variables), otherwise the default below. Note: GitHub pauses scheduled
# workflows after 60 days without repository activity, and may delay runs a few minutes.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://pm-copilot-api.onrender.com' }}
        # A cold start can take ~60s; never fail the workflow over a slow wake-up.
        run: curl -fsS --max-time 90 "$BACKEND_URL/health" || echo "Backend did not respond (it may be deploying)."
